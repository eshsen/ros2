name: PR07 checks

on:
  push:
    branches: [pr07]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COURSE_KIT_URL: "https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w10-7a91d388d7bd.tar.gz"
  COURSE_KIT_SHA256: 7a91d388d7bd3def7e058c8da48c32ff27ea6f14dc880a2da169c4102d456874

jobs:
  test:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr07'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ros:lyrical-ros-base

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates \
            python3-colcon-common-extensions python3-pytest \
            ros-lyrical-ament-cmake-pytest \
            ros-lyrical-ackermann-msgs \
            ros-lyrical-xacro \
            ros-lyrical-robot-state-publisher \
            ros-lyrical-tf2-ros-py

      - name: Download and verify course kit
        run: |
          curl -fsSL "$COURSE_KIT_URL" -o /tmp/course-kit.tar.gz
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz \
            | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Build description and simulation packages
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon --log-base log-pr07 build \
            --build-base build-pr07 \
            --install-base install-pr07 \
            --symlink-install \
            --packages-select course_description course_simulation
          test -f install-pr07/course_description/share/course_description/urdf/vehicle.urdf.xacro
          test -f install-pr07/course_simulation/share/course_simulation/launch/simulation.launch.py

      - name: Test simulation adapters
        run: |
          source /opt/ros/lyrical/setup.bash
          source install-pr07/setup.bash
          colcon --log-base log-pr07 test \
            --build-base build-pr07 \
            --install-base install-pr07 \
            --packages-select course_simulation \
            --return-code-on-test-failure \
            --event-handlers console_direct+
          colcon test-result --test-result-base build-pr07 --verbose

      - name: Check PR07 evidence contract
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR07 \
            --submission . --json
