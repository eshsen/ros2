name: PR05 checks

on:
  push:
    branches: [pr05]
  pull_request:
  workflow_dispatch:

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w08-aea8efd0a516.tar.gz
  COURSE_KIT_SHA256: aea8efd0a51668af63f2e475b82bfa28bd76c21f20d8afea6b136d43a56a88fb

jobs:
  test:
    if: github.event_name != 'pull_request' || github.head_ref == 'pr05'
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify course kit
        run: |
          curl -fsSL "$COURSE_KIT_URL" -o /tmp/course-kit.tar.gz
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Build packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-select turtle_bringup patrol course_bringup
          test -f install/course_bringup/share/course_bringup/launch/patrol.launch.py
          test -f install/course_bringup/lib/course_bringup/pose_relay
          test -f install/course_bringup/lib/course_bringup/pose_subscriber

      - name: Test packages
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test \
            --packages-select turtle_bringup patrol course_bringup \
            --return-code-on-test-failure \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: Check launch arguments
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 launch course_bringup patrol.launch.py --show-args

      - name: Check PR05 submission
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
